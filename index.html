<!DOCTYPE html>
<html lang="id" x-data="{ darkMode: localStorage.getItem('theme') === 'dark' }" 
    :class="{ 'dark': darkMode }" class="scroll-smooth">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- nanti dihapus -->
        <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https:; connect-src 'self' http://127.0.0.1:5500 ws://127.0.0.1:5500;"> -->
        <!-- end nanti dihapus -->
        <title>Company Profile | Modern Business</title>

        <script src="https://cdn.tailwindcss.com"></script>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@900&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Ms+Madi&family=Great+Vibes&display=swap" rel="stylesheet">
        <!-- End Fonts -->

        <!-- Custom CSS -->
        <link rel="stylesheet" href="css/theme.css">
        <link rel="stylesheet" href="css/glassmorphism.css">
        <link rel="stylesheet" href="css/navbar.css">
        <link rel="stylesheet" href="css/hero.css">
        <link rel="stylesheet" href="css/food-preview.css">
        <link rel="stylesheet" href="css/about.css">
        <link rel="stylesheet" href="css/contact.css">
        <link rel="stylesheet" href="css/form-layanan.css">
        <link rel="stylesheet" href="css/footer.css">
        <link rel="stylesheet" href="css/menu.css">
        <link rel="stylesheet" href="css/cart.css">
        <link rel="stylesheet" href="css/trust.css">
        <link rel="stylesheet" href="css/modal.css">
        <link rel="stylesheet" href="css/invoice.css">
        <link rel="stylesheet" href="css/calendar.css">
        <link rel="stylesheet" href="css/SPA.css">
        <!-- End Custom CSS -->

        <!-- Tailwind Config -->
        <script src="js/tailwind-config.js"></script>
        <!-- End Tailwind Config -->

        <!-- AOS || Font Awesome || Swiper -->
        <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
        <!-- End AOS || Font Awesome || Swiper -->

        <!-- Kalendar -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_green.css">
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
        <!-- End Kalendar -->

        <!-- Javascript Libraries Swiper || SweetAlert -->
        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <!-- End Javascript Libraries Swiper || SweetAlert -->

        <!-- Custom Javascript -->
        <script src="js/calendar.js"></script>
        <script src="js/food-preview.js"></script>
        <script src="js/navbar.js"></script>
        <script src="js/data-menu.js"></script>
        <script src="js/menu.js"></script>
        <script src="js/cart.js"></script>
        <script src="js/jam-operasional.js"></script>
        <script src="js/form-layanan.js"></script>
        <!-- End Custom Javascript -->

        <!-- Javascript Alpine Library -->
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <!-- End Javascript Alpine Library -->

    </head>

    <body x-data="{ halamanAktif: 'home' }"
        x-effect="if($store.navigasi.halaman) { 
            $nextTick(() => { 
                setTimeout(() => { if(typeof AOS !== 'undefined') AOS.refresh(); }, 500); 
            }); 
        }" 
        class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans">

        <header>

            <!-- Navbar Desktop-->
            <div class="hidden md:block"
                x-data="{ navContent: '' }" 
                x-init="fetch('Resources/Views/Components/navbar.html')
                        .then(res => res.text())
                        .then(data => {
                            navContent = data;
                        })" 
                x-html="navContent"
                x-show="$store.navigasi.halaman === 'home'" 
                x-transition:enter-start="opacity-0 -translate-y-10">
            </div>
            <!-- End Navbar Desktop -->

            <!-- Navbar Mobile -->
            <div class="md:hidden"
                x-data="{ mobileNav: '' }" 
                x-init="fetch('Resources/Views/Components/Mobile/navbar.html')
                        .then(res => res.text())
                        .then(data => mobileNav = data)" 
                x-html="mobileNav">
            </div>
            <!-- End Navbar Mobile -->

        </header>

        <main>

            <!-- Section -->
            <div x-show="$store.navigasi.halaman === 'home'" x-transition x-cloak>

                <!-- Home || Hero Desktop -->
                <div id="hero" 
                    class="hidden md:block w-full"
                    x-data="{ heroContent: '' }" 
                    x-init="fetch('Resources/Views/Sections/hero.html')
                            .then(res => res.text())
                            .then(data => { 
                                heroContent = data; 
                                $nextTick(() => initAOS()); 
                            })" 
                    x-html="heroContent">
                </div>
                <!-- End Home || Hero Desktop -->

                <!-- Home || Hero Mobile -->
                <div id="hero-mobile"
                    class="block md:hidden w-full" 
                    x-data="{ heroMobile: '' }" 
                    x-init="fetch('Resources/Views/Sections/Mobile/hero.html').then(r => r.text()).then(d => heroMobile = d)" 
                    x-html="heroMobile">
                </div>
                <!-- End Home || Hero Mobile -->

                <!-- Food Preview -->
                <div id="food-preview" 
                    class="hidden md:block w-full"
                    x-data="{ foodPreviewContent: '' }" 
                    x-init="fetch('Resources/Views/Sections/food-preview.html')
                            .then(res => res.text())
                            .then(data => { 
                                foodPreviewContent = data; 
                                
                                // Gunakan $nextTick untuk memastikan DOM sudah dirender oleh Alpine
                                $nextTick(() => { 
                                    // 1. Hancurkan Swiper lama jika ada (mencegah memory leak)
                                    if (window.foodSwiper instanceof Swiper) {
                                        window.foodSwiper.destroy(true, true);
                                    }

                                    // 2. Jalankan AOS & Inisialisasi Swiper Baru
                                    initAOS(); 
                                    
                                    // Pastikan fungsi ini menyimpan objek Swiper ke window.foodSwiper
                                    initFoodSwiper(); 

                                    // Tambahkan refresh AOS opsional jika elemen tidak muncul
                                    if(typeof AOS !== 'undefined') AOS.refresh();
                                });
                            })"
                    x-html="foodPreviewContent">
                </div>
                <!-- End Food Preview -->

                <!-- Food Preview Mobile -->
                <div id="food-preview-mobile"
                    class="block md:hidden w-full"
                    x-data="{ foodMobileContent: '' }" 
                    x-init="if(window.innerWidth < 768) {
                        fetch('Resources/Views/Sections/Mobile/food-preview.html')
                        .then(res => res.text())
                        .then(data => { 
                            foodMobileContent = data;
                            $nextTick(() => { if(typeof initFoodSwiper === 'function') initFoodSwiper(); });
                        })
                    }" 
                    x-html="foodMobileContent">
                </div>
                <!-- End Food Preview Mobile -->

                <!-- Trust -->
                <div id="trust"
                    class="hidden md:block w-full"
                    x-data="{ trustContent: '' }" 
                    x-init="fetch('Resources/Views/Sections/trust.html')
                            .then(res => res.text())
                            .then(data => { 
                                trustContent = data; 
                                $nextTick(() => initAOS()); 
                            })" 
                    x-html="trustContent">
                </div>
                <!-- End Trust -->

                <!-- Trust Mobile -->
                <div id="trust-mobile"
                    class="block md:hidden w-full" 
                    x-data="{ trustM: '' }" 
                    x-init="fetch('Resources/Views/Sections/Mobile/trust.html').then(r=>r.text()).then(d=>trustM=d)" 
                    x-html="trustM">
                </div>
                <!-- End Trust Mobile -->

                <!-- About -->
                <div id="about" 
                    class="hidden md:block w-full"
                    x-data="{ aboutContent: '' }" 
                    x-init="fetch('Resources/Views/Sections/about.html')
                            .then(res => res.text())
                            .then(data => { 
                                aboutContent = data; 
                                $nextTick(() => initAOS()); 
                            })" 
                    x-html="aboutContent">
                </div>
                <!-- End About -->

                <!-- About Mobile -->
                <div id="about-mobile"
                    class="block md:hidden w-full" 
                    x-data="{ aboutM: '' }" 
                    x-init="fetch('Resources/Views/Sections/Mobile/about.html').then(r=>r.text()).then(d=>aboutM=d)" 
                    x-html="aboutM">
                </div>
                <!-- End About Mobile -->

                <!-- Contact -->
                <div id="contact"
                    class="hidden md:block w-full"
                    x-data="{ contactContent: '' }" 
                    x-init="fetch('Resources/Views/Sections/contact.html')
                            .then(res => res.text())
                            .then(data => { 
                                contactContent = data; 
                                $nextTick(() => initAOS()); 
                            })" 
                    x-html="contactContent">
                </div>
                <!-- End Contact -->

                <!-- Contact Mobile -->
                <div id="contact-mobile"
                    class="block md:hidden w-full" 
                    x-data="{ contactM: '' }" 
                    x-init="fetch('Resources/Views/Sections/Mobile/contact.html').then(r=>r.text()).then(d=>contactM=d)" 
                    x-html="contactM">
                </div>
                <!-- End Contact Mobile -->

            </div>
            <!-- End Sections -->

            <!-- Menu -->
            <div id="menu-container" 
            x-show="$store.navigasi.halaman === 'menu'" 
            x-transition 
            x-cloak
            x-init="fetch('Resources/Layouts/menu.html')
                    .then(res => res.text())
                    .then(html => { 
                        $el.innerHTML = html;
                        // KRUSIAL: Inisialisasi ulang AOS jika ada animasi
                        $nextTick(() => { typeof AOS !== 'undefined' && AOS.refresh(); });
                    })">
            </div>
            <!-- End Menu -->

            <!-- Cart -->
            <div id="cart" 
                class="hidden md:block w-full"
                x-show="$store.navigasi.halaman === 'cart'" 
                x-transition x-cloak 
                class="pt-10 pb-12 min-h-screen">
                <div x-data="{ cartSection: '' }" 
                    x-init="fetch('Resources/Layouts/cart.html')
                            .then(res => {
                                if (!res.ok) throw new Error('Gagal load keranjang');
                                return res.text();
                            })
                            .then(data => { 
                                cartSection = data; 
                                // Inisialisasi ulang AOS jika diperlukan di halaman cart
                                $nextTick(() => { if(typeof initAOS === 'function') initAOS(); }); 
                            })
                            .catch(err => {
                                console.error(err);
                                cartSection = `<div class='text-center py-20 text-slate-500'>
                                                <p class='text-lg font-bold'>Wah, ada kendala teknis.</p>
                                                <p class='text-sm'>Gagal memuat keranjang. Silakan coba refresh halaman.</p>
                                            </div>`;
                            })" 
                    x-html="cartSection">
                    
                    <div class="flex flex-col items-center justify-center py-32 space-y-4">
                        <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-green-600"></div>
                        <p class="text-slate-400 text-xs font-medium animate-pulse">
                            Menyiapkan keranjang belanja...
                        </p>
                    </div>
                </div>
            </div>
            <!-- End Cart -->

            <!-- Cart Mobile -->
            <div id="cart-mobile" 
                x-show="$store.navigasi.halaman === 'cart'" 
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 translate-x-full"
                x-transition:enter-end="opacity-100 translate-x-0"
                x-cloak 
                class="block md:hidden min-h-screen bg-slate-50 dark:bg-slate-950"
                x-data="{ loaded: false }"
                x-init="
                    fetch('Resources/Layouts/Mobile/cart.html')
                        .then(res => res.text())
                        .then(data => { 
                            // 1. Masukkan HTML ke dalam element
                            $el.innerHTML = data; 
                            
                            // 2. Beri jeda micro-task agar DOM siap, lalu inisialisasi Alpine
                            $nextTick(() => { 
                                Alpine.initTree($el); 
                                if(typeof initAOS === 'function') initAOS();
                            });
                        })
                ">
                <div class="flex flex-col items-center justify-center py-40">
                    <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-green-600 mb-4"></div>
                    <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Menyiapkan Pesanan...</p>
                </div>
            </div>
            <!-- End Cart Mobile -->

            <!-- Notifikasi Tambah ke Keranjang -->
            <div x-data 
                x-show="$store.keranjang.showToast" 
                x-transition:enter="transition ease-out duration-500"
                x-transition:enter-start="opacity-0 translate-y-20 scale-90"
                x-transition:enter-end="opacity-100 translate-y-0 scale-100"
                x-transition:leave="transition ease-in duration-300"
                x-transition:leave-start="opacity-100 scale-100"
                x-transition:leave-end="opacity-0 scale-90"
                class="fixed bottom-28 left-1/2 -translate-x-1/2 z-[110] w-[92%] max-w-[340px]"
                x-cloak>
                
                <div class="bg-slate-900/90 dark:bg-slate-800/95 backdrop-blur-xl p-2 rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.3)] border border-white/10 flex items-center justify-between pointer-events-auto">
                    
                    <div class="flex items-center gap-3 ml-2">
                        <div class="w-6 h-6 rounded-full bg-green-500 text-white flex items-center justify-center flex-shrink-0 shadow-lg shadow-green-500/40">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                                <path fill-rule="evenodd" d="M19.916 4.626a.75.75 0 0 1 .208 1.04l-9 13.5a.75.75 0 0 1-1.154.114l-6-6a.75.75 0 0 1 1.06-1.06l5.353 5.353 8.493-12.74a.75.75 0 0 1 1.04-.208Z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        
                        <div class="flex flex-col">
                            <span class="text-[9px] uppercase tracking-[0.2em] text-green-400 font-black leading-none mb-1"></span>
                            <p class="text-[12px] font-bold text-white line-clamp-1" x-text="$store.keranjang.toastMsg"></p>
                        </div>
                    </div>

                    <button @click="$store.navigasi.pindah('cart'); $store.keranjang.showToast = false" 
                            class="bg-white text-slate-900 px-5 py-2.5 rounded-[1.5rem] text-[10px] font-black uppercase tracking-widest active:scale-90 transition-all shadow-sm">
                        Lihat
                    </button>
                </div>
            </div>
            <!-- End Notifikasi Tambah ke Keranjang -->

        </main>

        <!-- Footer -->
        <div class="hidden md:block w-full"
            x-data="{ footerContent: '' }" 
            x-init="fetch('Resources/Views/Components/footer.html')
                    .then(res => res.text())
                    .then(data => { 
                        footerContent = data;
                        
                        // Gunakan nextTick agar Alpine selesai merender HTML-nya dulu
                        $nextTick(() => {
                            // Beri sedikit delay (100-300ms) agar browser selesai menyusun layout
                            setTimeout(() => {
                                if(typeof AOS !== 'undefined') {
                                    AOS.refresh(); 
                                }
                            }, 300);
                        });
                    })" 
            x-html="footerContent">
        </div>
        <!-- End Footer -->

        <!-- Footer Mobile -->
        <div class="block md:hidden" 
            x-data="{ footerMobile: '' }" 
            x-init="fetch('Resources/Views/Components/Mobile/footer.html').then(r=>r.text()).then(d=>footerMobile=d)" 
            x-html="footerMobile">
        </div>
        <!-- End Footer Mobile -->

        <!-- Modal / Pop-up -->
        <div x-data="{ modalContent: '' }" 
            x-init="fetch('Resources/Views/Modals/modal.html')
                    .then(res => res.text())
                    .then(data => modalContent = data)" 
            x-html="modalContent">
        </div>
        <!-- End Modal / Pop-up -->

        <!-- Checkout Mobile -->
        <div id="checkout-mobile" 
            x-show="$store.navigasi.halaman === 'checkout'" 
            x-transition:enter="transition ease-out duration-300 transform"
            x-transition:enter-start="translate-x-full"
            x-transition:enter-end="translate-x-0"
            x-transition:leave="transition ease-in duration-200 transform"
            x-transition:leave-start="translate-x-0"
            x-transition:leave-end="translate-x-full"
            x-cloak 
            class="block md:hidden fixed inset-0 z-[60] bg-slate-50 dark:bg-slate-950 overflow-y-auto">
            
            <div x-init="
                fetch('Resources/Layouts/Mobile/checkout.html')
                    .then(res => res.text())
                    .then(data => { 
                        $el.innerHTML = data; 
                        $nextTick(() => { 
                            Alpine.initTree($el);
                        });
                    })
            ">
                <div class="flex flex-col items-center justify-center min-h-screen">
                    <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-green-600"></div>
                </div>
            </div>
        </div>
        <!-- End Checkout Mobile -->

        <!-- Show Menu -->
        <div x-data x-show="$store.keranjang.isDetailOpen" class="fixed inset-0 z-[100] flex items-end justify-center" x-cloak>
    
            <div x-show="$store.keranjang.isDetailOpen" 
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0"
                x-transition:enter-end="opacity-100"
                @click="$store.keranjang.closeDetail()" 
                class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>

            <div x-show="$store.keranjang.isDetailOpen"
                x-transition:enter="transition ease-out duration-300 transform"
                x-transition:enter-start="translate-y-full"
                x-transition:enter-end="translate-y-0"
                class="relative bg-white dark:bg-slate-900 w-full max-w-md rounded-t-[2.5rem] p-6 pb-10 shadow-2xl">
                
                <div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full mx-auto mb-6"></div>

                <template x-if="$store.keranjang.selectedProduct">
                    <div>
                        <img :src="$store.keranjang.selectedProduct.img" class="w-full h-60 object-cover rounded-[2rem] mb-4 shadow-md">
                        
                        <h2 class="text-2xl font-black text-slate-800 dark:text-white uppercase tracking-tighter" x-text="$store.keranjang.selectedProduct.name"></h2>
                        
                        <p class="text-xl font-black text-green-600 mb-4" 
                        x-text="'Rp ' + ($store.keranjang.selectedProduct.price / 1000) + 'k'"></p>
                        
                        <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed mb-8" x-text="$store.keranjang.selectedProduct.desc"></p>

                        <button @click="$store.keranjang.addItem($store.keranjang.selectedProduct); $store.keranjang.closeDetail()" 
                                class="w-full py-4 bg-green-600 text-white rounded-2xl font-black uppercase tracking-widest text-xs shadow-lg active:scale-95 transition-all">
                            Tambah ke Keranjang
                        </button>
                    </div>
                </template>
            </div>
        </div>
        <!-- End Show Menu -->

        <!-- Javascript AOS -->
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
        <script src="js/AOS.js"></script>
        <!-- End Javascript AOS -->

    </body>

</html>
