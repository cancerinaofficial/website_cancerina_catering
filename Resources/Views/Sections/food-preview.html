<section id="food-preview" class="block py-24 bg-[#FCFCFA] dark:bg-[#0B0F1A] overflow-hidden">
    <div class="max-w-7xl mx-auto px-6">

        <!-- Header -->
        <div class="text-center mb-16" 
            data-aos="fade-up">

            <!-- Title -->
            <span class="inline-block px-4 py-1 mb-4 text-[10px] font-black tracking-[0.3em] text-green-600 uppercase">
                Signature Collection
            </span>
            <h2 class="text-4xl md:text-7xl leading-[0.85] text-slate-800/90 dark:text-white/90 mb-6 tittle-heavy"
                style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; letter-spacing: -0.05em;">
                Simfoni Rasa 
                <span class="block md:inline italic text-green-700 dark:text-green-500 font-normal" 
                    style="font-family: 'Playfair Display', serif; line-height: 1.2; letter-spacing: 0;">
                    Terbaik Kami
                </span>
            </h2>
            <!-- End Title -->

            <!-- Line -->
            <div class="flex items-center justify-center gap-4 mb-10 overflow-hidden dot-pulse" 
                data-aos="fade-up" 
                data-aos-delay="100">
                <div class="w-24 h-[1px] bg-gradient-to-r from-transparent to-green-600/60"></div>
                
                <div class="relative flex items-center justify-center flex-shrink-0">
                    <div class="w-5 h-5 border border-green-600/50 rounded-full"></div>
                    <div class="absolute w-1.5 h-1.5 bg-green-600/80 rounded-full"></div>
                </div>
                
                <div class="w-24 h-[1px] bg-gradient-to-l from-transparent to-green-600/60"></div>
            </div>
            <!-- End Line -->

            <!-- Description -->
            <p class="max-w-2xl mx-auto text-slate-400 dark:text-slate-300/80 italic font-serif text-lg leading-relaxed">
                "Menghadirkan harmoni rempah nusantara yang dikurasi khusus untuk memanjakan palet rasa Anda. Mahakarya kuliner dari dapur Cancerina."
            </p>
            <!-- End Description -->

        </div>
        <!-- End Header -->

        <!-- Swiper || Isi Menu -->
        <div class="swiper foodBestSellerSwiper relative !pb-24 overflow-visible mask-gradient" 
            data-aos="fade-up" 
            data-aos-delay="200"
            x-data="{ foodContent: '' }" 
            x-init="fetch('Resources/Layouts/isi-food-preview.html')
                    .then(res => res.text())
                    .then(data => { 
                        foodContent = data;
                        $nextTick(() => { 
                            if(typeof initFoodSwiper === 'function') initFoodSwiper(); 
                        });
                    })">
            
            <div class="swiper-wrapper" x-html="foodContent"></div>
            
            <div class="swiper-pagination !bottom-2"></div>

            <div class="swiper-scrollbar !-bottom-4 !h-1 !w-1/3 !mx-auto !left-0 !right-0"></div>
        </div>
        <!-- End Swiper || Isi Menu -->

        <!-- Button Container -->
        <div class="mt-16 text-center" 
            data-aos="fade-up">

            <a @click.prevent="$store.navigasi.pindah('menu', '')"  
                class="group relative inline-flex items-center gap-8 px-10 py-5 bg-green-700 dark:bg-green-600 text-white rounded-full transition-all duration-500 hover:scale-105 hover:shadow-[0_20px_50px_rgba(21,128,61,0.3)] active:scale-95 shadow-xl shadow-green-900/10">

                <!-- Button -->
                <button class="flex flew-grow items-center justify-center gap-4">
                    <span class="text-sm font-black uppercase tracking-[0.2em] ml-2">
                        Explore Menu
                    </span>

                    <div class="flex items-center justify-center w-10 h-10 bg-white/20 backdrop-blur-md rounded-full transition-all duration-500 group-hover:bg-white group-hover:text-green-700">
                        <i class="fa-solid fa-utensils text-sm transition-transform duration-500 group-hover:rotate-12"></i>
                    </div>
                </button>
                <!-- End Button -->

            </a>

            <!-- Description -->
            <p class="mt-6 text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-[0.3em]">
                Tersedia lebih dari 10+ varian menu otentik
            </p>
            <!-- End Description -->

        </div>
        <!-- End Button Container -->

    </div>
</section>
