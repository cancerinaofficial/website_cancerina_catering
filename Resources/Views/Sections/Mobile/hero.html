<section id="hero-mobile" 
        class="md:hidden block relative w-full bg-slate-50 pt-8 pb-8 overflow-hidden dark:bg-slate-950">

    <div class="absolute top-0 right-0 w-full h-1/2 bg-gradient-to-b from-green-500/10 to-transparent pointer-events-none"></div>
    <div class="absolute -top-10 -right-10 w-48 h-48 bg-green-600/10 rounded-full blur-3xl"></div>

    <!-- Container -->
    <div class="container mx-auto px-6 z-10 flex flex-col gap-10">

        <!-- Header -->
        <div class="text-center" data-aos="fade-up">

            <!-- Badge -->
            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-green-100 dark:bg-green-900/30 border border-green-200 dark:border-green-800 mb-6">
                <span class="flex h-1.5 w-1.5 rounded-full bg-green-600 animate-pulse"></span>
                <span class="text-[9px] font-black text-green-700 dark:text-green-400 uppercase tracking-widest">
                    Trenggalek Catering Service
                </span>
            </div>
            <!-- End Badge -->

            <!-- Title -->
            <h1 class="text-4xl font-black leading-tight mb-4">
                <span class="text-slate-900 dark:text-white">
                    Makan Enak,
                </span><br>
                <span class="relative inline-block mt-2">
                    <span class="font-script text-6xl text-transparent bg-clip-text bg-gradient-to-r from-green-600 to-green-400">
                        Gak Pake Ribet.
                    </span>
                    <span class="absolute -bottom-1 left-0 w-full opacity-60">
                        <svg viewBox="0 0 500 20" fill="none" class="w-full">
                            <path d="M10 10C50 15 150 5 300 12C400 16 480 8 490 10" 
                            stroke="#16a34a" 
                            stroke-width="8" 
                            stroke-linecap="round" />
                        </svg>
                    </span>
                </span>
            </h1>
            <!-- End Title -->

            <!-- Description -->
            <p class="text-slate-500 dark:text-slate-400 text-sm leading-relaxed max-w-[280px] mx-auto mb-8" 
                data-aos="fade-up" 
                data-aos-delay="200">
                <span class="text-green-600 dark:text-green-500 font-bold">
                    Rempah Asli Nusantara
                </span> 
                    yang diracik tanpa kompromi. Menghadirkan 
                <span class="italic text-slate-800 dark:text-slate-200/80 underline decoration-wavy decoration-green-600 dark:decoration-green-400/50">
                    Citarasa Otentik
                </span> 
                    untuk setiap momen istimewa Anda.
            </p>
            <!-- End Description -->

        </div>
        <!-- End Header -->

        <!-- Image -->
        <div class="relative w-full aspect-square max-w-[280px] mx-auto" 
            data-aos="zoom-in"
            data-aos-delay="200">

            <div class="absolute -inset-4 bg-green-500/10 blur-3xl rounded-full"></div>
            
            <div class="absolute -inset-6 border border-dashed border-green-600/20 rounded-[2.5rem] animate-[spin_30s_linear_infinite]"></div>

            <div class="relative w-full h-full -rotate-3 bg-white dark:bg-slate-800 p-3 shadow-2xl border border-slate-100 dark:border-slate-700 rounded-[2rem]">
                <div class="relative w-full h-full -rotate-2 rounded-[1.5rem] overflow-hidden">
                    <img src="Storage/img/menu-makanan/ayam-lodho.jpeg" alt="Ayam Lodho" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent"></div>
                </div>
            </div>

            <!-- Badge -->
            <div class="absolute -bottom-4 -right-2 z-20 bg-white/90 dark:bg-slate-900/95 backdrop-blur-md p-3 rounded-2xl border border-white/20 shadow-xl rotate-6"
                data-aos="fade-left" 
                data-aos-delay="800">
                
                <div class="flex items-center gap-2.5">
                    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-gradient-to-tr from-orange-500 to-yellow-400 flex items-center justify-center text-sm shadow-md">
                        <span>🔥</span>
                    </div>

                    <div class="leading-tight">
                        <p class="text-[7px] text-green-600 dark:text-green-400 font-black uppercase italic tracking-wider mb-0.5">

                        </p>
                        <p class="text-[10px] font-black text-slate-800 dark:text-white whitespace-nowrap">

                        </p>
                    </div>
                </div>
            </div>
            <!-- End Badge -->

        </div>
        <!-- End Image -->

        <!-- Button -->
        <div class="flex flex-col gap-4 pt-8 w-full max-w-[320px] mx-auto">

            <!-- Button 1 -->
            <button @click="$store.navigasi.pindah('home', '#food-preview-mobile')" 
                class="group relative flex items-center gap-4 px-5 py-3 bg-gradient-to-br from-green-600 to-green-700 text-white rounded-2xl font-bold border-2 border-green-500/30 transition-all active:scale-95 shadow-xl shadow-green-600/20">
                
                <div class="flex-shrink-0 flex items-center justify-center w-12 h-12 rounded-full bg-white/20 backdrop-blur-sm border border-white/30 group-active:scale-90 transition-transform">
                    <i class="fa-solid fa-leaf text-green-200 text-lg"></i>
                </div>

                <div class="flex flex-col text-left leading-tight">
                    <span class="text-[9px] uppercase tracking-[0.2em] text-green-200 mb-0.5 font-medium">
                        Jelajahi
                    </span>
                    <a class="font-sans text-sm tracking-wide">
                        Hidangan Nusantara
                    </a>
                </div>

                    <i class="fa-solid fa-arrow-right text-xs text-green-300 ml-auto"></i>
            </button>
            <!-- End Button 1 -->

            <!-- Button 2 -->
            <button @click="$store.navigasi.pindah('home', '#contact-mobile')"
                class="group flex items-center gap-4 px-5 py-3 bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-2xl transition-all active:scale-95 shadow-sm">
                
                <div class="flex-shrink-0 flex items-center justify-center w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-800 shadow-inner group-active:scale-90 transition-transform">
                    <i class="fa-solid fa-comments text-green-600 text-lg"></i>
                </div>

                <div class="flex flex-col text-left leading-tight">
                    <span class="font-sans text-sm font-black text-slate-800 dark:text-white">
                        Butuh Bantuan?
                    </span>
                    <a class="text-[10px] text-slate-500 dark:text-slate-400 italic">
                        Silahkan Hubungi Kami
                    </a>
                </div>
            </button>
            <!-- End Button 2 -->

        </div>
        <!-- End Button -->

        <!-- Ornament -->
        <div class="pt-8 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center px-2" 
            data-aos="fade-up" 
            data-aos-delay="600">

            <!-- Ornament 1 -->
            <div class="flex flex-col items-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-green-100 dark:bg-green-900/30 flex items-center justify-center">
                    <i class="fas fa-leaf text-green-600 text-sm"></i>
                </div>
                <span class="text-[8px] font-black text-slate-400 uppercase tracking-tighter">
                    Fresh
                </span>
            </div>
            <!-- End Ornament 1 -->

            <!-- Ornament 2 -->
            <div class="flex flex-col items-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-orange-100 dark:bg-orange-900/30 flex items-center justify-center">
                    <i class="fas fa-utensils text-orange-500 text-sm"></i>
                </div>
                <span class="text-[8px] font-black text-slate-400 uppercase tracking-tighter">
                    Expert Chef
                </span>
            </div>
            <!-- End Ornament 2 -->

            <!-- Ornament 3 -->
            <div class="flex flex-col items-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center">
                    <i class="fas fa-box text-blue-500 text-sm"></i>
                </div>
                <span class="text-[8px] font-black text-slate-400 uppercase tracking-tighter">
                    Eco Pack
                </span>
            </div>
            <!-- End Ornament 3 -->

        </div>
        <!-- End Ornament -->

    </div>

</section>
