<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Mobile - Cancerina Catering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <div x-data="{ inv: JSON.parse(localStorage.getItem('last_invoice')) || {} }" class="max-w-md mx-auto">
        
        <div class="p-6 flex items-center justify-between sticky top-0 bg-slate-50/80 backdrop-blur-md z-10 print:hidden">
            <button @click="localStorage.removeItem('cart_items'); window.location.href = '../../../../index.html'" 
                    class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-600 active:scale-90 transition-all border border-slate-100">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button onclick="window.print()" class="px-5 py-2.5 bg-green-600 text-white rounded-2xl font-bold text-xs shadow-lg shadow-green-500/20 active:scale-95 transition-all">
                <i class="fa-solid fa-download mr-2"></i> Simpan PDF
            </button>
        </div>

        <div class="px-4">
            <div class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden relative border border-slate-100">
                <div class="h-2 bg-green-600 w-full"></div>

                <div class="p-8 text-center border-b border-dashed border-slate-100">
                    <div class="w-16 h-16 bg-green-50 rounded-3xl mx-auto flex items-center justify-center mb-4 text-green-600 text-2xl">
                        <i class="fa-solid fa-receipt"></i>
                    </div>
                    <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">
                        Cancerina <span class="text-green-600">Catering</span>
                    </h1>
                    <div class="mt-4 inline-flex items-center gap-2 px-4 py-1.5 bg-green-100 text-green-700 rounded-full text-[10px] font-black uppercase tracking-widest"
                         x-text="inv.tipe === 'lunas' ? 'LUNAS' : 'DP 50%'">
                    </div>
                    <div class="mt-6 flex justify-between items-center text-left bg-slate-50 p-4 rounded-2xl">
                        <div>
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">No. Pesanan</p>
                            <p class="text-sm font-black text-slate-800" x-text="inv.no"></p>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Tanggal</p>
                            <p class="text-sm font-bold text-slate-800" x-text="inv.tanggal"></p>
                        </div>
                    </div>
                </div>

                <div class="p-8 space-y-6">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4">Rincian Menu</p>

                    <div class="space-y-4">
                        <div class="flex items-center gap-4 pb-2 border-b border-slate-50 text-[9px] font-black text-slate-400 uppercase tracking-widest">
                            <div class="flex-1 pl-2">Menu</div>
                            <div class="w-10 text-center">Qty</div>
                            <div class="w-24 text-right pr-4">Total</div>
                        </div>

                        <template x-for="item in inv.items">
                            <div class="flex items-start gap-4 py-1">
                                <div class="flex-1 min-w-0">
                                    <p class="text-sm font-bold text-slate-800 truncate" x-text="item.name"></p>
                                    <p class="text-[10px] text-slate-400 mt-0.5 italic leading-tight" 
                                    x-show="item.note" 
                                    x-text="item.note">
                                    </p>
                                </div>

                                <div class="w-10 text-center">
                                    <span class="text-xs font-black text-green-600 bg-green-50 px-2 py-1 rounded-lg" 
                                        x-text="item.qty">
                                    </span>
                                </div>

                                <div class="w-24 text-right">
                                    <p class="text-sm font-black text-slate-800" 
                                    x-text="'Rp' + (item.price * item.qty).toLocaleString('id-ID')">
                                    </p>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div class="pt-6 border-t-2 border-dashed border-slate-100 space-y-3">
                        <div class="flex justify-between text-xs font-medium">
                            <span class="text-slate-400">Subtotal</span>
                            <span class="text-slate-800" x-text="'Rp ' + (inv.subtotal || 0).toLocaleString('id-ID')"></span>
                        </div>
                        <div class="flex justify-between text-xs font-medium">
                            <span class="text-slate-400">Ongkos Kirim</span>
                            <span class="text-slate-800" x-text="'Rp ' + (inv.ongkir || 0).toLocaleString('id-ID')"></span>
                        </div>
                        <div class="flex justify-between text-xs font-bold text-green-600 italic" x-show="inv.biayaLayanan > 0">
                            <span>Biaya Layanan</span>
                            <span x-text="'Rp ' + (inv.biayaLayanan || 0).toLocaleString('id-ID')"></span>
                        </div>
                        <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                            <span class="text-sm font-black text-slate-800 uppercase">Total Bayar</span>
                            <span class="text-xl font-black text-green-600" x-text="'Rp ' + (inv.total || 0).toLocaleString('id-ID')"></span>
                        </div>
                    </div>
                </div>

                <div class="p-8 bg-slate-50 text-center space-y-4">
                    <div class="inline-block p-4 bg-white rounded-3xl border border-slate-100">
                        <img :src="'https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=' + inv.no" class="w-24 h-24 mx-auto opacity-80" alt="QR Code">
                    </div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">
                        Simpan invoice ini sebagai bukti pesanan
                    </p>
                </div>
            </div>

            <div class="mt-8 space-y-3">
                <!-- <button onclick="window.print()" class="w-full py-5 bg-slate-800 text-white rounded-[2rem] font-black uppercase tracking-[0.2em] text-[10px] flex items-center justify-center gap-3 active:scale-95 transition-all print:hidden">
                    <i class="fa-solid fa-download"></i> Simpan PDF
                </button> -->
                <p class="text-center text-[10px] text-slate-400 font-medium">
                    Butuh bantuan? <a href="#" class="text-green-600 font-bold underline">Hubungi WhatsApp</a>
                </p>
            </div>
        </div>
    </div>

</body>
</html>
