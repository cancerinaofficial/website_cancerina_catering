<!DOCTYPE html>
<html lang="id" x-data="invoicePage()" x-init="init()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice - Cancerina Catering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .receipt-edge {
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.05));
        }
        /* Efek gerigi kertas di bawah */
        .zig-zag {
            position: relative;
            background: white;
        }
        .zig-zag::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(-45deg, transparent 5px, white 5px), 
                        linear-gradient(45deg, transparent 5px, white 5px);
            background-size: 10px 10px;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen flex items-center justify-center p-4">

    <div x-cloak x-show="invoice" class="w-full max-w-md"
         x-transition:enter="transition ease-out duration-500"
         x-transition:enter-start="opacity-0 scale-95 translate-y-10">
        
        <div class="flex items-center justify-between mb-6 px-2">
            <a href="../../../index.html" class="w-10 h-10 rounded-xl bg-white dark:bg-slate-900 shadow-sm flex items-center justify-center text-slate-400">
                <i class="fa-solid fa-house"></i>
            </a>
            <span class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-400">E-Receipt</span>
            <button @click="window.print()" class="w-10 h-10 rounded-xl bg-white dark:bg-slate-900 shadow-sm flex items-center justify-center text-slate-400">
                <i class="fa-solid fa-print"></i>
            </button>
        </div>

        <div class="zig-zag rounded-t-[2.5rem] p-8 shadow-xl dark:bg-slate-900">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-black text-green-600 uppercase tracking-tighter">Cancerina</h1>
                <p class="text-[8px] font-bold text-slate-400 uppercase tracking-[0.4em]">Katering Nusantara</p>
                
                <div class="mt-6 py-2 px-4 bg-slate-50 dark:bg-slate-800 rounded-full inline-block">
                    <span class="text-[10px] font-black text-slate-600 dark:text-slate-300" x-text="invoice.no"></span>
                </div>

                <div class="flex justify-center my-6">
                    <img :src="'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + invoice.no" 
                        class="w-32 h-32 border-4 border-white dark:border-slate-800 shadow-sm rounded-2xl transition-transform hover:scale-105" 
                        alt="QR Code Pesanan">
                </div>
            </div>

            <div class="mt-6 flex flex-col items-center">
    
                <div class="relative w-16 h-16 flex items-center justify-center mb-3">
                    <template x-if="status === 'loading'">
                        <div class="absolute inset-0 border-4 border-slate-100 dark:border-slate-800 border-t-green-500 rounded-full animate-spin"></div>
                    </template>
                    
                    <template x-if="status === 'pending'">
                        <div class="w-12 h-12 bg-amber-100 dark:bg-amber-900/30 rounded-full flex items-center justify-center animate-bounce">
                            <i class="fa-solid fa-clock text-amber-600 text-xl"></i>
                        </div>
                    </template>

                    <template x-if="status === 'success'">
                        <div class="w-12 h-12 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center scale-125 transition-transform">
                            <i class="fa-solid fa-check-double text-green-600 text-xl"></i>
                        </div>
                    </template>
                </div>

                <div class="px-6 py-1.5 rounded-full text-[10px] font-black uppercase tracking-[0.2em] shadow-sm transition-all duration-500"
                    :class="{
                        'bg-slate-100 text-slate-400': status === 'loading',
                        'bg-amber-500 text-white shadow-amber-500/20': status === 'pending',
                        'bg-green-600 text-white shadow-green-500/20': status === 'success'
                    }">
                    <span x-text="status === 'loading' ? 'Memproses...' : (status === 'pending' ? 'Menunggu Pembayaran' : 'Pembayaran Berhasil')"></span>
                </div>
            </div>

            <div class="space-y-3 mb-8 border-b border-dashed border-slate-100 dark:border-slate-800 pb-6">
                <div class="flex justify-between text-[11px]">
                    <span class="text-slate-400 font-bold uppercase tracking-widest">Tanggal</span>
                    <span class="text-slate-800 dark:text-white font-black" x-text="invoice.tanggal"></span>
                </div>
                <div class="flex justify-between text-[11px]">
                    <span class="text-slate-400 font-bold uppercase tracking-widest">Metode</span>
                    <span class="text-slate-800 dark:text-white font-black uppercase" x-text="invoice.metode"></span>
                </div>
            </div>

            <div class="space-y-4 mb-8">
                <template x-for="item in invoice.items" :key="item.id">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h4 class="text-xs font-black text-slate-800 dark:text-white" x-text="item.name"></h4>
                            <p class="text-[10px] text-slate-400 font-bold" x-text="item.qty + ' x ' + formatRupiah(item.price)"></p>
                        </div>
                        <span class="text-xs font-black text-slate-800 dark:text-white" x-text="formatRupiah(item.price * item.qty)"></span>
                    </div>
                </template>
            </div>

            <div class="space-y-2 pt-6 border-t border-slate-100 dark:border-slate-800">
                <div class="flex justify-between text-xs">
                    <span class="text-slate-400 font-bold uppercase">Subtotal</span>
                    <span class="text-slate-800 dark:text-white font-bold" x-text="formatRupiah(invoice.subtotal)"></span>
                </div>
                <div class="flex justify-between text-xs">
                    <span class="text-slate-400 font-bold uppercase">Layanan</span>
                    <span class="text-slate-800 dark:text-white font-bold" x-text="formatRupiah(invoice.biayaLayanan)"></span>
                </div>
                <div class="flex justify-between items-center pt-4">
                    <span class="text-sm font-black uppercase tracking-widest text-green-600">Total</span>
                    <span class="text-xl font-black text-slate-800 dark:text-white" x-text="formatRupiah(invoice.total)"></span>
                </div>
            </div>
        </div>

        <div class="mt-12 space-y-3">
            <button @click="kirimBuktiWA()" 
                    class="w-full py-5 bg-green-600 text-white rounded-[2rem] font-black uppercase tracking-widest text-xs shadow-lg shadow-green-500/30 flex items-center justify-center gap-3 active:scale-95 transition-all">
                <i class="fa-brands fa-whatsapp text-lg"></i>
                Kirim Bukti Transfer
            </button>
            <p class="text-center text-[9px] text-slate-400 font-bold uppercase tracking-widest">
                Pesanan akan diproses setelah bukti dikirim
            </p>
        </div>
    </div>

    <script>
        function invoicePage() {
            return {
                invoice: null,
                status: 'loading', // 'loading', 'pending', 'success'

                init() {
                    const data = localStorage.getItem('last_invoice');
                    if (!data) {
                        window.location.href = '../../../index.html';
                        return;
                    }
                    this.invoice = JSON.parse(data);

                    // Simulasi "Sistem sedang memverifikasi data"
                    setTimeout(() => {
                        this.status = 'pending';
                    }, 2000);
                },
                
                // ... fungsi formatRupiah & kirimBuktiWA tetap sama ...
            }
        }
    </script>
</body>
</html>
