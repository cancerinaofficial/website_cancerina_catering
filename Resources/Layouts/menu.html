<section id="menu" 
    class="block pt-0 mb-10 bg-slate-50 dark:bg-slate-950 transition-colors duration-500 min-h-screen" 
    x-data="menuManager">

    <div class="hidden md:flex container mx-auto px-6 pt-6 pb-8">
        <button @click="$store.navigasi.pindah('home')" 
                class="group flex items-center gap-3 p-2 pr-6 w-max bg-white/60 dark:bg-slate-900/60 backdrop-blur-lg rounded-2xl border border-white/20 dark:border-slate-800/50 shadow-sm hover:shadow-xl hover:bg-white/90 dark:hover:bg-slate-900/90 transition-all duration-300">
            
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-green-500 to-emerald-600 text-white flex items-center justify-center shadow-lg shadow-green-500/20 group-hover:scale-110 group-hover:rotate-[-10deg] transition-all duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" 
                    fill="none" 
                    viewBox="0 0 24 24" 
                    stroke-width="2.5" 
                    stroke="currentColor" 
                    class="w-5 h-5">
                    <path stroke-linecap="round" 
                        stroke-linejoin="round" 
                        d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
            </div>

            <div class="flex flex-col items-start">
                <span class="text-[10px] uppercase tracking-[0.2em] text-slate-400 dark:text-slate-500 font-black leading-none mb-1">Kembali</span>
                <span class="text-sm font-bold text-slate-700 dark:text-slate-200 group-hover:text-green-600 transition-colors">Beranda Utama</span>
            </div>
        </button>
    </div>

    <div class="container mx-auto px-6">
        <div class="text-center max-w-2xl mx-auto mb-8 md:mb-16 px-4" 
            data-aos="fade-up">
    
            <h2 class="text-3xl sm:text-4xl md:text-5xl font-black text-slate-950 dark:text-white leading-[1.1] tracking-tighter">
                Pilih Menu 
                <span class="relative inline-block text-green-600">
                    Favoritmu
                    <span class="absolute -bottom-1 left-0 w-full h-1 bg-green-500/20 rounded-full"></span>
                </span>
            </h2>

            <p class="mt-3 text-xs md:text-sm text-slate-500 dark:text-slate-400 font-medium max-w-[280px] md:max-w-none mx-auto">
                Temukan kelezatan otentik di setiap hidangan kami.
            </p>
        </div>

        <div class="sticky top-4 md:top-8 z-40 mb-8 md:mb-16 flex justify-center w-full px-4">
    
            <div class="p-1.5 md:p-2 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl rounded-3xl md:rounded-[2.5rem] shadow-xl border border-slate-200/50 dark:border-slate-800/50 w-full md:w-max overflow-hidden">
                
                <div class="flex flex-nowrap md:flex-wrap items-center justify-start md:justify-center gap-1.5 md:gap-2 overflow-x-auto no-scrollbar pb-0">
                    
                    <template x-for="cat in ['all', 'best_seller', 'tradisional', 'nasi_kotak', 'snack_box', 'parcel']">
                        <button @click="kategoriAktif = cat" 
                                :class="kategoriAktif === cat 
                                    ? 'bg-green-600 text-white shadow-md scale-105' 
                                    : 'text-slate-500 hover:bg-slate-50 dark:hover:bg-slate-800'" 
                                class="whitespace-nowrap px-5 md:px-6 py-2 md:py-2.5 rounded-full font-bold transition-all text-[11px] md:text-sm capitalize flex-shrink-0 active:scale-95"
                                x-text="cat.replace('_', ' ')">
                        </button>
                    </template>
                    
                </div>
            </div>
        </div>

        <div id="anchor-menu" 
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 mb-20 min-h-[400px]" 
            x-html="menuTampil"
            @click="tangkapKlik($event)">
        </div>

        <div class="flex flex-wrap justify-center items-center gap-2 md:gap-3 mt-10 mb-20" 
            x-show="totalHalaman > 1" 
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 transform translate-y-4">
            
            <button @click="gantiHalaman(halamanAktif - 1)" 
                    :disabled="halamanAktif === 1" 
                    class="h-12 px-4 md:px-6 rounded-2xl font-bold bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 disabled:opacity-30 shadow-sm transition-all hover:border-green-500 hover:text-green-600 active:scale-90">
                <span class="hidden md:inline">← Prev</span>
                <span class="md:hidden">←</span>
            </button>
            
            <div class="flex gap-2 overflow-x-auto no-scrollbar max-w-[50vw] md:max-w-none px-2 py-1">
                <template x-for="p in totalHalaman" :key="p">
                    <button @click="gantiHalaman(p)" 
                            x-text="p" 
                            :class="halamanAktif === p 
                                ? 'bg-green-600 text-white border-green-600 shadow-md scale-105' 
                                : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800'" 
                            class="w-10 h-10 md:w-12 md:h-12 flex-shrink-0 rounded-xl md:rounded-2xl font-black border transition-all hover:border-green-500 active:scale-90">
                    </button>
                </template>
            </div>

            <button @click="gantiHalaman(halamanAktif + 1)" 
                    :disabled="halamanAktif === totalHalaman" 
                    class="h-12 px-4 md:px-6 rounded-2xl font-bold bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 disabled:opacity-30 shadow-sm transition-all hover:border-green-500 hover:text-green-600 active:scale-90">
                <span class="hidden md:inline">Next →</span>
                <span class="md:hidden">→</span>
            </button>
        </div>
    </div>
</section>
